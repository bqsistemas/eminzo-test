<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Service status panel</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <div class="layout">
      <nav class="sidebar" aria-label="Examples navigation">
        <div class="sidebar-group">
          <h2 class="sidebar-group-title">Examples</h2>
          <ul class="sidebar-links">
            <li><a href="#greeting">Greeting</a></li>
            <li><a href="#service-status">Service status</a></li>
            <li><a href="#events" lang="es">Eventos</a></li>
          </ul>
        </div>
      </nav>
      <main class="panel">
        <h1>Service status panel</h1>
        <p class="panel-intro">Status of the service, checked once when the page opens.</p>
        <p id="greeting" class="greeting" lang="es">Hola, Mundo</p>
        <p
          id="service-status"
          class="status"
          role="status"
          aria-live="polite"
          aria-atomic="true"
          aria-busy="true"
          data-state="loading"
        >
          Checking the service…
        </p>
        <aside id="events" class="events" lang="es">Espacio para eventos</aside>
        <noscript>
          <p class="status" data-state="unavailable">
            This panel needs JavaScript to check the service.
          </p>
        </noscript>
      </main>
    </div>
  </body>
</html>
